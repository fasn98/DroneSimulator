name: Twin v2 physics tests

on:
  push:
    branches: [main, twin-v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install physics-core dependencies
        run: pip install "numpy>=2.0" "scipy>=1.11" pytest
      - name: Run verification tests
        run: python -m pytest tests/ -v
